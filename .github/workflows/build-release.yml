name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must already exist, e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe with PyInstaller
        run: pyinstaller --onefile --name imgex main.py
      - name: Smoke test Chinese paths (round-trip via built exe)
        shell: bash
        run: |
          python - <<'EOF'
          import numpy as np, cv2, os, subprocess
          from PIL import Image
          d = os.path.join(os.environ['TEMP'], '图片 测试')
          os.makedirs(d, exist_ok=True)
          rng = np.random.default_rng(3)
          A = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          B = A.copy()
          B[10:30, 20:40] = rng.integers(0, 256, (20, 20, 3), dtype=np.uint8)
          pa = os.path.join(d, '原图A.png')
          pb = os.path.join(d, '处理后B.png')
          Image.fromarray(A).save(pa)
          Image.fromarray(B).save(pb)
          enc = os.path.join(d, '编码输出.png')
          dec = os.path.join(d, '解码输出.png')
          subprocess.run(['./dist/imgex.exe', '-o', pa, '-c', pb, '-p', 'test', '-O', enc],
                         check=True, capture_output=True)
          subprocess.run(['./dist/imgex.exe', '-c', enc, '-p', 'test', '-O', dec],
                         check=True, capture_output=True)
          got = cv2.imdecode(np.fromfile(dec, dtype=np.uint8), cv2.IMREAD_COLOR)
          pa_ref = cv2.imdecode(np.fromfile(pa, dtype=np.uint8), cv2.IMREAD_COLOR)
          assert np.array_equal(got, pa_ref), 'chinese path round-trip mismatch'
          print('SMOKE OK: chinese-path encode/decode round-trip via exe')
          EOF
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgex-windows
          path: dist/imgex.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build binary with PyInstaller
        run: pyinstaller --onefile --name imgex main.py
      - name: Smoke test (round-trip via built binary)
        run: |
          python - <<'EOF'
          import numpy as np, cv2, subprocess
          rng = np.random.default_rng(0)
          A = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          B = A.copy()
          B[10:30, 20:40] = rng.integers(0, 256, (20, 20, 3), dtype=np.uint8)
          cv2.imwrite('/tmp/smoke_A.png', A)
          cv2.imwrite('/tmp/smoke_B.png', B)
          subprocess.run(['./dist/imgex', '-o', '/tmp/smoke_A.png', '-c', '/tmp/smoke_B.png',
                          '-p', 'test', '-O', '/tmp/smoke_enc.png'], check=True, capture_output=True)
          subprocess.run(['./dist/imgex', '-c', '/tmp/smoke_enc.png', '-p', 'test',
                          '-O', '/tmp/smoke_dec.png'], check=True, capture_output=True)
          assert np.array_equal(cv2.imread('/tmp/smoke_dec.png'), A), 'round-trip mismatch'
          print('SMOKE OK: encode/decode round-trip matches original')
          EOF
      - name: Smoke test per-channel codec (gray/RGBA/channel-independence via built binary)
        run: |
          python - <<'EOF'
          import numpy as np, cv2, subprocess, re
          rng = np.random.default_rng(1)

          def rt(name, A, mod_fn):
              cv2.imwrite(f'/tmp/pc_{name}_A.png', A)
              B = A.copy(); mod_fn(B)
              cv2.imwrite(f'/tmp/pc_{name}_B.png', B)
              subprocess.run(['./dist/imgex', '-o', f'/tmp/pc_{name}_A.png', '-c', f'/tmp/pc_{name}_B.png',
                              '-p', 'test', '-O', f'/tmp/pc_{name}_enc.png'], check=True, capture_output=True)
              subprocess.run(['./dist/imgex', '-c', f'/tmp/pc_{name}_enc.png', '-p', 'test',
                              '-O', f'/tmp/pc_{name}_dec.png'], check=True, capture_output=True)
              got = cv2.imread(f'/tmp/pc_{name}_dec.png', cv2.IMREAD_UNCHANGED)
              assert got.ndim == A.ndim, f'{name}: channel count changed ({got.ndim} vs {A.ndim})'
              assert np.array_equal(got, A), f'{name}: round-trip mismatch'
              print(f'SMOKE OK: {name} ({A.ndim}d, shape={A.shape}) round-trip')

          A = rng.integers(0, 256, (64, 64), dtype=np.uint8)
          rt('gray', A, lambda B: B[10:30, 20:40].__setitem__(slice(None), rng.integers(0, 256, (20, 20), dtype=np.uint8)))
          A = rng.integers(0, 256, (64, 64, 4), dtype=np.uint8)
          rt('rgba', A, lambda B: B[10:30, 20:40].__setitem__(slice(None), rng.integers(0, 256, (20, 20, 4), dtype=np.uint8)))
          A = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          rt('indep', A, lambda B: B[5:15, 5:15, 2].__setitem__(slice(None), B[5:15, 5:15, 2] ^ 0x55))

          def k_from_decode(enc_path):
              r = subprocess.run(['./dist/imgex', '-c', enc_path, '-p', 'test',
                                  '-O', '/tmp/pc_alpha_dec.png'], check=True, capture_output=True)
              return int(re.search(r'确认扩展 (\\d+) 圈', r.stdout.decode()).group(1))
          A = np.zeros((64, 64, 4), dtype=np.uint8)
          A[:, :, :3] = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          A[:, :, 3] = 0
          A[8:56, 8:56, 3] = 255
          cv2.imwrite('/tmp/pc_alpha_A.png', A)
          B1 = A.copy()
          B1[20:40, 30:50, :3] = rng.integers(0, 256, (20, 20, 3), dtype=np.uint8)
          cv2.imwrite('/tmp/pc_alpha1_B.png', B1)
          subprocess.run(['./dist/imgex', '-o', '/tmp/pc_alpha_A.png', '-c', '/tmp/pc_alpha1_B.png',
                          '-p', 'test', '-O', '/tmp/pc_alpha1_enc.png'], check=True, capture_output=True)
          enc1 = cv2.imread('/tmp/pc_alpha1_enc.png', cv2.IMREAD_UNCHANGED)
          k1 = k_from_decode('/tmp/pc_alpha1_enc.png')
          assert np.array_equal(enc1[k1:64 + k1, k1:64 + k1, 3], B1[:, :, 3]), 'alpha-identical: alpha must be noise-free'
          assert not np.array_equal(enc1[k1:64 + k1, k1:64 + k1, :3], B1[:, :, :3]), 'alpha-identical: RGB must carry noise'
          assert np.array_equal(cv2.imread('/tmp/pc_alpha_dec.png', cv2.IMREAD_UNCHANGED), A), 'alpha-identical round-trip'
          print('SMOKE OK: alpha identical -> alpha noise/data/fill disabled, round-trip intact')
          B2 = A.copy()
          B2[20:40, 30:50] = rng.integers(0, 256, (20, 20, 4), dtype=np.uint8)
          cv2.imwrite('/tmp/pc_alpha2_B.png', B2)
          subprocess.run(['./dist/imgex', '-o', '/tmp/pc_alpha_A.png', '-c', '/tmp/pc_alpha2_B.png',
                          '-p', 'test', '-O', '/tmp/pc_alpha2_enc.png'], check=True, capture_output=True)
          k2 = k_from_decode('/tmp/pc_alpha2_enc.png')
          enc2 = cv2.imread('/tmp/pc_alpha2_enc.png', cv2.IMREAD_UNCHANGED)
          assert not np.array_equal(enc2[k2:64 + k2, k2:64 + k2, 3], B2[:, :, 3]), 'alpha-differs: alpha should carry noise'
          assert np.array_equal(cv2.imread('/tmp/pc_alpha_dec.png', cv2.IMREAD_UNCHANGED), A), 'alpha-differs round-trip'
          print('SMOKE OK: alpha differs -> normal noise on alpha, round-trip intact')
          EOF
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgex-macos
          path: dist/imgex
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build binary with PyInstaller
        run: pyinstaller --onefile --name imgex main.py
      - name: Smoke test (round-trip via built binary)
        run: |
          python - <<'EOF'
          import numpy as np, cv2, subprocess
          rng = np.random.default_rng(0)
          A = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          B = A.copy()
          B[10:30, 20:40] = rng.integers(0, 256, (20, 20, 3), dtype=np.uint8)
          cv2.imwrite('/tmp/smoke_A.png', A)
          cv2.imwrite('/tmp/smoke_B.png', B)
          subprocess.run(['./dist/imgex', '-o', '/tmp/smoke_A.png', '-c', '/tmp/smoke_B.png',
                          '-p', 'test', '-O', '/tmp/smoke_enc.png'], check=True, capture_output=True)
          subprocess.run(['./dist/imgex', '-c', '/tmp/smoke_enc.png', '-p', 'test',
                          '-O', '/tmp/smoke_dec.png'], check=True, capture_output=True)
          assert np.array_equal(cv2.imread('/tmp/smoke_dec.png'), A), 'round-trip mismatch'
          print('SMOKE OK: encode/decode round-trip matches original')
          EOF
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgex-linux
          path: dist/imgex
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "Releasing tag: $TAG"
          gh release create "$TAG" \
            artifacts/imgex-windows/imgex.exe \
            artifacts/imgex-linux/imgex \
            artifacts/imgex-macos/imgex \
            --generate-notes --title "imgex $TAG" \
            --clobber