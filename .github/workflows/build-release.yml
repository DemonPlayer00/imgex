name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must already exist, e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe with PyInstaller
        run: pyinstaller --onefile --name imgex main.py
      - name: Smoke test (Chinese path round-trip via built exe)
        shell: bash
        run: |
          python - <<'PYEOF'
          import numpy as np, cv2, os, subprocess
          from PIL import Image
          d = os.path.join(os.environ['TEMP'], '图片 测试')
          os.makedirs(d, exist_ok=True)
          rng = np.random.default_rng(3)
          img_a = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          img_b = img_a.copy()
          img_b[10:30, 20:40] = rng.integers(0, 256, (20, 20, 3), dtype=np.uint8)
          pa = os.path.join(d, '原图A.png')
          pb = os.path.join(d, '处理后B.png')
          Image.fromarray(img_a).save(pa)
          Image.fromarray(img_b).save(pb)
          enc = os.path.join(d, '编码输出.png')
          dec = os.path.join(d, '解码输出.png')
          subprocess.run(['./dist/imgex.exe', '-o', pa, '-c', pb, '-p', 'test', '-O', enc],
                         check=True, capture_output=True)
          subprocess.run(['./dist/imgex.exe', '-c', enc, '-p', 'test', '-O', dec],
                         check=True, capture_output=True)
          got = cv2.imdecode(np.fromfile(dec, dtype=np.uint8), cv2.IMREAD_COLOR)
          ref = cv2.imdecode(np.fromfile(pa, dtype=np.uint8), cv2.IMREAD_COLOR)
          assert np.array_equal(got, ref), 'Chinese path round-trip mismatch'
          print('SMOKE OK: Chinese path encode/decode round-trip via built exe')
          PYEOF
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgex-windows
          path: dist/imgex.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build binary with PyInstaller
        run: pyinstaller --onefile --name imgex main.py
      - name: Smoke test (round-trip via built binary)
        run: |
          python - <<'PYEOF'
          import numpy as np, cv2, subprocess
          rng = np.random.default_rng(0)
          img_a = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          img_b = img_a.copy()
          img_b[10:30, 20:40] = rng.integers(0, 256, (20, 20, 3), dtype=np.uint8)
          cv2.imwrite('/tmp/smoke_A.png', img_a)
          cv2.imwrite('/tmp/smoke_B.png', img_b)
          subprocess.run(['./dist/imgex', '-o', '/tmp/smoke_A.png', '-c', '/tmp/smoke_B.png',
                          '-p', 'test', '-O', '/tmp/smoke_enc.png'], check=True, capture_output=True)
          subprocess.run(['./dist/imgex', '-c', '/tmp/smoke_enc.png', '-p', 'test',
                          '-O', '/tmp/smoke_dec.png'], check=True, capture_output=True)
          assert np.array_equal(cv2.imread('/tmp/smoke_dec.png'), img_a), 'round-trip mismatch'
          print('SMOKE OK: encode/decode round-trip matches original')
          PYEOF
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgex-macos
          path: dist/imgex
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build binary with PyInstaller
        run: pyinstaller --onefile --name imgex main.py
      - name: Smoke test (round-trip via built binary)
        run: |
          python - <<'PYEOF'
          import numpy as np, cv2, subprocess
          rng = np.random.default_rng(0)
          img_a = rng.integers(0, 256, (64, 64, 3), dtype=np.uint8)
          img_b = img_a.copy()
          img_b[10:30, 20:40] = rng.integers(0, 256, (20, 20, 3), dtype=np.uint8)
          cv2.imwrite('/tmp/smoke_A.png', img_a)
          cv2.imwrite('/tmp/smoke_B.png', img_b)
          subprocess.run(['./dist/imgex', '-o', '/tmp/smoke_A.png', '-c', '/tmp/smoke_B.png',
                          '-p', 'test', '-O', '/tmp/smoke_enc.png'], check=True, capture_output=True)
          subprocess.run(['./dist/imgex', '-c', '/tmp/smoke_enc.png', '-p', 'test',
                          '-O', '/tmp/smoke_dec.png'], check=True, capture_output=True)
          assert np.array_equal(cv2.imread('/tmp/smoke_dec.png'), img_a), 'round-trip mismatch'
          print('SMOKE OK: encode/decode round-trip matches original')
          PYEOF
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgex-linux
          path: dist/imgex
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Inspect downloaded artifacts
        run: find artifacts -type f -ls
      - name: Create GitHub Release (draft) and upload assets via API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          REPO="DemonPlayer00/imgex"

          echo "Creating draft release for tag: $TAG"
          # Create draft release, capture upload_url
          API_JSON=$(gh api "repos/${REPO}/releases" \
            --method POST \
            --field tag_name="${TAG}" \
            --field target_commitish="master" \
            --field name="imgex ${TAG}" \
            --field draft=true \
            --field generate_release_notes=true)
          RELEASE_ID=$(echo "${API_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Release ID: ${RELEASE_ID}"

          upload_asset() {
            local file="$1"
            local name="$2"
            local mime="$3"
            echo "  Uploading ${name} (${file})..."
            curl -sS -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: ${mime}" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${name}"
            echo ""
          }

          upload_asset "artifacts/imgex-windows/imgex.exe" "imgex-windows.exe" "application/vnd.microsoft.portable-executable"
          upload_asset "artifacts/imgex-macos/imgex"       "imgex-macos"       "application/octet-stream"
          upload_asset "artifacts/imgex-linux/imgex"       "imgex-linux"       "application/octet-stream"

          echo "Publishing release..."
          gh api "repos/${REPO}/releases/${RELEASE_ID}" \
            --method PATCH \
            --field draft=false

          echo "Release URL: https://github.com/${REPO}/releases/tag/${TAG}"